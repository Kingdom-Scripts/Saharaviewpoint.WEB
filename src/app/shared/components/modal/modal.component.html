<div class="fixed inset-0 z-50 flex h-full items-center justify-center overflow-hidden" @fade #modal>
  <div class="fixed inset-0 transition-opacity" (click)="close()" @fade #backdrop>
    <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
  </div>

  <div
    class="overflow-hidde w-[95%] transform rounded-lg bg-white text-left transition-all"
    [ngClass]="{
      'sm:w-[calc(100vw/5)]': size === 'small',
      'sm:w-[calc(100vw/3)]': size === 'normal',
      'sm:w-[calc(100vw/2)]': size === 'large'
    }"
    style="max-height: 90%; overflow-y: auto">
    <!-- Content -->
    <div #container></div>
  </div>
</div>
