<div class="group relative flex h-44 w-44 cursor-pointer flex-col items-center justify-center overflow-hidden rounded-lg bg-white shadow-md">
  <div class="absolute hidden h-full w-full bg-gray-200/50 group-hover:block" *ngIf="uploadStatus !== 'uploading'"></div>

  <!-- Progress bar -->
  <div class="absolute flex h-full w-full bg-gray-200/30 items-end animate-pulse" *ngIf="uploadStatus === 'uploading'">
    <div class="h-1 bg-blue-600" [style.width.%]="uploadProgress"></div>
  </div>

  <!-- Delete and Download button --->
  <div *ngIf="uploadStatus !== 'uploading'" class="absolute right-0 top-0 mr-1 mt-1 hidden space-x-1 text-center text-sm group-hover:flex">
    <button class="flex items-center rounded-md bg-slate-900 p-2 text-center text-sm font-medium text-white hover:bg-gray-700" (click)="downloadAttachment()" *ngIf="uploadStatus === 'uploaded'">
      <svg-icon src="assets/icons/heroicons/outline/download.svg" [svgClass]="'h-4 w-4'" />
    </button>

    <button class="flex items-center rounded-md bg-red-700 p-2 text-center text-sm font-medium text-white hover:bg-red-900" (click)="requestDelete.emit(document.id)">
      <svg-icon src="assets/icons/trash.svg" [svgClass]="'h-4 w-4'" />
    </button>
  </div>

  <!-- Attachment thumbnail -->
  <!-- set div's background as the thumbnail -->
  <div id="thumbnail" class="h-[120px] w-full bg-cover bg-center bg-no-repeat" [style.background-image]="'url(' + document.thumbnailUrl + ')'"></div>

  <div class="flex-grow"></div>

  <!-- Attachment metadata -->
  <div class="w-full bg-gray-100 p-1">
    <p class="text-sm tracking-tight text-slate-900">{{ trimmedFileName }}</p>

    <p class="text-sm text-slate-900" *ngIf="uploadStatus === 'uploaded'">
      {{ document.createdAt !== undefined ? (document.createdAt | utcToLocalDate) : '' }}
    </p>

    <p class="text-sm italic text-slate-900" *ngIf="uploadStatus === 'uploading'">
      Uploading...
    </p>

    <p class="text-sm text-red-700" *ngIf="uploadStatus === 'failed'">
      Upload Failed!
    </p>
  </div>
</div>
